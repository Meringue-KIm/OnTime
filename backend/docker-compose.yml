services:
  postgres:
    image: postgres:16
    container_name: commute_postgres
    environment:
      POSTGRES_DB: commute_db
      POSTGRES_USER: commute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: commute_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
